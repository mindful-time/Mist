[package]
name = "mist"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Mist contributors"]
description = "A cross-platform living mist that speaks selected text with Kokoro TTS"
license = "MIT"
homepage = "https://github.com/mindful-time/Mist"
repository = "https://github.com/mindful-time/Mist"

[package.metadata.packager]
product-name = "Mist"
identifier = "dev.akshobhya.select-to-speak"
category = "Utility"
publisher = "Mindful Time"
homepage = "https://github.com/mindful-time/Mist"
description = "A living desktop mist that speaks selected text locally with Kokoro TTS"
long-description = "Mist is a cross-platform desktop companion that reads selected text locally with Kokoro TTS."
out-dir = "dist/packages"
icons = ["assets/mist-orb-512-v1.png"]
license-file = "LICENSE"
resources = [
    { src = "LICENSE", target = "licenses/Mist-LICENSE" },
    { src = "third_party/kokoro-micro/LICENSE", target = "licenses/kokoro-micro-LICENSE" },
    { src = "third_party/kokoro-micro/NOTICE", target = "licenses/kokoro-micro-NOTICE" },
    { src = "third_party/kokoro-micro/THIRD_PARTY_LICENSES", target = "licenses/kokoro-micro-THIRD_PARTY_LICENSES" },
    { src = "assets/fonts/OFL-NotoSansDevanagariUI.txt", target = "licenses/NotoSansDevanagariUI-OFL" },
]

[package.metadata.packager.macos]
minimum-system-version = "13.0"
background-app = true
info-plist-path = "macos/Info.plist"

[package.metadata.packager.nsis]
installer-mode = "currentUser"

[package.metadata.packager.deb]
depends = [
    "libc6",
    "libegl1",
    "libgl1",
    "libstdc++6",
    "libwayland-client0",
    "libwayland-egl1",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxcursor1",
    "libxi6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxrender1",
    "xdg-desktop-portal",
    "fonts-dejavu-core",
    "fonts-noto-core",
    "fonts-noto-cjk",
    "pipewire-bin | pulseaudio-utils | alsa-utils | ffmpeg",
]

[dependencies]
anyhow = "1.0"
arboard = "3.6"
directories = "6.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
enigo = "0.6.1"
hound = "3.5"
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
kokoro-micro = { version = "=1.3.0", default-features = false }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.49", features = ["rt-multi-thread"] }
ureq = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
global-hotkey = "0.8"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
tray-icon = { version = "0.25.1", default-features = false }
kokoro-micro = { version = "=1.3.0", default-features = false, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.8"
uiautomation = "0.25.1"
tray-icon = { version = "0.25.1", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Media_Multimedia"] }
kokoro-micro = { version = "=1.3.0", default-features = false, features = ["cuda", "directml"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
enigo = { version = "0.6.1", features = ["wayland"] }
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = "0.3"
global-hotkey = "0.8"
libc = "0.2"
wl-clipboard-rs = "0.9.3"
x11-clipboard = "0.9.3"
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
kokoro-micro = { version = "=1.3.0", default-features = false, features = ["cuda"] }

[dev-dependencies]
skrifa = "0.44.0"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
# Upstream 1.3.0 exposes only CUDA. This audited local patch adds Core ML and
# DirectML while retaining the public Kokoro API and Apache-2.0 notices.
kokoro-micro = { path = "third_party/kokoro-micro" }
