[package]
name = "select-to-speak"
version = "0.1.0"
edition = "2024"
description = "A tiny macOS desktop pet that speaks selected text with Kokoro TTS"
license = "MIT"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hound = "3.5"
kokoro-en = { version = "0.1.5", default-features = false, features = ["misaki-lean"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.49", features = ["rt-multi-thread"] }
ureq = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.6"
enigo = { version = "0.6", default-features = false }
global-hotkey = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
enigo = { version = "0.6", default-features = false, features = ["wayland", "x11rb"] }
global-hotkey = "0.8"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
