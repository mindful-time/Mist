[package]
name = "select-to-speak"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A tiny cross-platform desktop pet that speaks selected text with Kokoro TTS"
license = "MIT"

[dependencies]
anyhow = "1.0"
directories = "6.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
hound = "3.5"
kokoro-en = { version = "0.1.5", default-features = false, features = ["misaki-lean"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.49", features = ["rt-multi-thread"] }
ureq = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
global-hotkey = "0.8"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.6"
global-hotkey = "0.8"
uiautomation = "0.25.1"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
global-hotkey = "0.8"
wl-clipboard-rs = "0.9.3"
x11-clipboard = "0.9.3"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
