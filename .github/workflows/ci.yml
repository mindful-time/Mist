name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Install Linux desktop headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate POSIX release installer
        if: runner.os != 'Windows'
        run: sh -n scripts/install-release.sh
      - name: Validate PowerShell release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-release.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
