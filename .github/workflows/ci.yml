name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    name: Repository metadata, workflows, and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.10'
      - name: Verify release metadata
        run: ./scripts/release-check.sh
      - name: Build website
        run: ./scripts/build-site.sh
      - name: Validate website output
        shell: bash
        run: |
          node --check site/mist.js
          node --check site/site.js
          test -s dist/site/index.html
          test -s dist/site/styles.css
          test -s dist/site/mist.js
          test -s dist/site/site.js
          test -s dist/site/assets/mist.png
          test -s dist/site/assets/mist-field-alpha-v1.webp
          test -f dist/site/.nojekyll
      - name: Validate GitHub Actions workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Test Linux release installer
        run: sh scripts/test-distribution.sh

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - uses: ./.github/actions/intel-onnxruntime
        if: matrix.os == 'macos-15-intel'
      - name: Install Linux desktop headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the unsigned macOS release candidate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-15-intel' && '13.3' || '13.0' }}
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo build --release --locked
          cargo packager --release --formats app
      - name: Validate the Intel app bundle without signing credentials
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          sh scripts/prepare-intel-app.sh dist/packages/Mist.app
      - name: Test real Intel speech generation
        if: matrix.os == 'macos-15-intel'
        shell: bash
        env:
          MIST_MODEL_DIR: ${{ runner.temp }}/mist-kokoro-model
        run: |
          dist/packages/Mist.app/Contents/MacOS/mist --install-model
          cargo test --release --locked --test kokoro_smoke -- --ignored --nocapture
      - name: Archive the unsigned macOS candidate with permissions and provenance
        if: runner.os == 'macOS'
        run: tar -cf dist/packages/Mist.app.tar -C dist/packages Mist.app
      - name: Retain the unsigned macOS candidate
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mist-ci-${{ matrix.os == 'macos-latest' && 'macos-aarch64' || 'macos-x86_64' }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/packages/Mist.app.tar
          retention-days: 90
          if-no-files-found: error
      - name: Build the unsigned Windows release candidate
        if: runner.os == 'Windows'
        run: cargo build --release --locked
      - name: Retain the unsigned Windows candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mist-ci-windows-x86_64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: target/release/mist.exe
          retention-days: 90
          if-no-files-found: error
      - name: Validate POSIX release installer
        if: runner.os != 'Windows'
        run: sh -n scripts/install-release.sh
      - name: Validate PowerShell release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-release.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Test Chocolatey package and installer trust decisions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-chocolatey.ps1

  packages:
    name: Linux package validation
    # Match the documented glibc/libstdc++ baseline, just as the release build does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-packages
        with:
          artifact-name: mist-ci-linux-${{ github.sha }}-attempt-${{ github.run_attempt }}

  quality:
    name: Quality and security gates
    # The committed coverage-backed CRAP baseline was captured on Apple Silicon.
    # Native compile/build/tests run on both Mac architectures and the other OSes.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/quality
