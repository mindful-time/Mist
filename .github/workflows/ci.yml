name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository metadata, workflows, and website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release metadata
        run: ./scripts/release-check.sh
      - name: Build website
        run: ./scripts/build-site.sh
      - name: Validate website output
        shell: bash
        run: |
          node --check site/mist.js
          node --check site/site.js
          test -s dist/site/index.html
          test -s dist/site/styles.css
          test -s dist/site/mist.js
          test -s dist/site/site.js
          test -s dist/site/assets/mist.png
          test -s dist/site/assets/mist-field-alpha-v1.webp
          test -f dist/site/.nojekyll
      - name: Validate GitHub Actions workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Test Linux release installer
        run: sh scripts/test-distribution.sh

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Install Linux desktop headers
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          fonts-dejavu-core fonts-noto-core fonts-noto-cjk
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo build --locked --all-targets
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate POSIX release installer
        if: runner.os != 'Windows'
        run: sh -n scripts/install-release.sh
      - name: Validate PowerShell release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-release.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Test Chocolatey package and installer trust decisions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-chocolatey.ps1

  quality:
    name: Quality and security gates
    # The committed coverage-backed CRAP baseline was captured on Apple Silicon.
    # Native compile/build/tests still run on all three OSes above.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.10'
      - name: Install Rust and coverage tools
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.95.0
          cargo install cargo-crap --version 0.5.0 --locked
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Install checksum-pinned security scanners
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mist-tools"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_darwin_arm64 \
            --output "$RUNNER_TEMP/mist-tools/osv-scanner"
          printf '%s  %s\n' a8cd6507b06239f463a7642430cfd2d154882f150f6e30cdc0653e28dfc34216 "$RUNNER_TEMP/mist-tools/osv-scanner" | shasum -a 256 --check --status
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz \
            --output "$RUNNER_TEMP/mist-tools/gitleaks.tar.gz"
          printf '%s  %s\n' b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 "$RUNNER_TEMP/mist-tools/gitleaks.tar.gz" | shasum -a 256 --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/mist-tools/gitleaks.tar.gz" --directory "$RUNNER_TEMP/mist-tools" gitleaks
          chmod 755 "$RUNNER_TEMP/mist-tools/osv-scanner"
          echo "$RUNNER_TEMP/mist-tools" >> "$GITHUB_PATH"
      - name: Run full quality and security gates
        run: sh scripts/check-quality.sh
      - name: Retain coverage, CRAP, and Smells evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.sha }}
          path: target/quality
          if-no-files-found: warn
