name: Release macOS Intel

on:
  push:
    tags: ["v*-macos-x86_64-preview.*"]
  workflow_dispatch:

concurrency:
  group: release-macos-x86_64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: macos-x86_64
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
