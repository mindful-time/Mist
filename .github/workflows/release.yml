name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (all builds the complete candidate bundle)
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Verify release version
        shell: bash
        run: |
          ./scripts/release-check.sh
          version=$(tr -d '[:space:]' < VERSION)
          git fetch --no-tags origin main
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") ;;
              *)
                echo "Tag $GITHUB_REF_NAME does not match VERSION $version." >&2
                exit 1
                ;;
            esac
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag must point to a commit on main." >&2
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Manual release tests must run from main." >&2
            exit 1
          fi

      - name: Verify successful main CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs

  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: aarch64
            binary_architecture: arm64
            deployment_target: "13.0"
          - runner: macos-15-intel
            architecture: x86_64
            binary_architecture: x86_64
            deployment_target: "13.3"
    runs-on: ${{ matrix.runner }}
    environment: release-signing
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - uses: ./.github/actions/intel-onnxruntime
        if: matrix.architecture == 'x86_64'
      - name: Require Apple release credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Repository secret $variable is required." >&2
              exit 1
            fi
          done
      - name: Install cargo-packager
        run: cargo install cargo-packager --version "$CARGO_PACKAGER_VERSION" --locked
      - name: Build app bundle
        run: |
          cargo build --release --locked
          cargo packager --release --formats app
          /usr/libexec/PlistBuddy -c "Print :NSServices" dist/packages/Mist.app/Contents/Info.plist >/dev/null
          binary=dist/packages/Mist.app/Contents/MacOS/mist
          test "$(lipo -archs "$binary")" = "${{ matrix.binary_architecture }}"
          test -f dist/packages/Mist.app/Contents/Resources/licenses/kokoro-micro-NOTICE
          test -f dist/packages/Mist.app/Contents/Resources/licenses/kokoro-micro-THIRD_PARTY_LICENSES
          test -f dist/packages/Mist.app/Contents/Resources/licenses/NotoSansDevanagariUI-OFL
      - name: Validate Intel runtime packaging
        if: matrix.architecture == 'x86_64'
        run: sh scripts/prepare-intel-app.sh dist/packages/Mist.app
      - name: Import Developer ID certificate
        id: keychain
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/mist-certificate.p12"
          keychain_path="$RUNNER_TEMP/mist-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "path=$keychain_path" >> "$GITHUB_OUTPUT"
      - name: Sign and notarize app
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app=dist/packages/Mist.app
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          actual_team_id=$(codesign -dv --verbose=4 "$app" 2>&1 |
            awk -F= '$1 == "TeamIdentifier" { print $2; exit }')
          if [ "$actual_team_id" != "$APPLE_TEAM_ID" ]; then
            echo "Signed app TeamIdentifier $actual_team_id does not match APPLE_TEAM_ID." >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/Mist.zip"
          ditto -c -k --keepParent "$app" "$archive"
          xcrun notarytool submit "$archive" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Create signed DMG
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          image_root="$RUNNER_TEMP/mist-image"
          mkdir -p "$image_root" dist/release
          ditto dist/packages/Mist.app "$image_root/Mist.app"
          ln -s /Applications "$image_root/Applications"
          image="dist/release/Mist-macos-${{ matrix.architecture }}.dmg"
          hdiutil create -volname Mist -srcfolder "$image_root" -ov -format UDZO "$image"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$image"
          xcrun notarytool submit "$image" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$image"
          xcrun stapler validate "$image"
          codesign --verify --verbose=2 "$image"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
      - name: Remove temporary keychain
        if: always() && steps.keychain.outputs.path != ''
        run: security delete-keychain "${{ steps.keychain.outputs.path }}" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mist-macos-${{ matrix.architecture }}
          path: dist/release/Mist-macos-${{ matrix.architecture }}.dmg
          if-no-files-found: error

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: preflight
    runs-on: windows-2025
    environment: release-signing
    env:
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
      WINDOWS_SIGNER_SHA256: ${{ vars.WINDOWS_SIGNER_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.95
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Require Windows release credentials
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "Repository secret WINDOWS_CERTIFICATE is required." }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Repository secret WINDOWS_CERTIFICATE_PASSWORD is required." }
          if ($env:WINDOWS_SIGNER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw "Repository variable WINDOWS_SIGNER_SHA256 must be a SHA-256 certificate fingerprint." }
      - name: Install packaging tools
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis --no-progress -y
          cargo install cargo-packager --version $env:CARGO_PACKAGER_VERSION --locked
      - name: Build executable
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked
          $binary = [IO.File]::ReadAllBytes("target\release\mist.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw "Expected an x64 PE executable, found machine type 0x$($machine.ToString('X4'))."
          }
      - name: Import certificate and sign executable
        id: certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $certificate = Join-Path $env:RUNNER_TEMP "mist-certificate.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $certificateObject = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificate,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          $actualFingerprint = $certificateObject.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256)
          if ($actualFingerprint -ne $env:WINDOWS_SIGNER_SHA256) {
            throw "WINDOWS_SIGNER_SHA256 does not match the signing certificate."
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found." }
          & $signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD target\release\mist.exe
          & $signtool verify /pa /v target\release\mist.exe
          "certificate=$certificate" >> $env:GITHUB_OUTPUT
          "signtool=$signtool" >> $env:GITHUB_OUTPUT
      - name: Package installer
        id: package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo packager --release --formats nsis
          $installer = Get-ChildItem dist\packages -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "cargo-packager did not produce an NSIS installer." }
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = "${{ steps.package.outputs.installer }}"
          & "${{ steps.certificate.outputs.signtool }}" sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /f "${{ steps.certificate.outputs.certificate }}" /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer
          & "${{ steps.certificate.outputs.signtool }}" verify /pa /v $installer
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Copy-Item $installer dist\release\Mist-windows-x86_64-setup.exe
      - name: Remove certificate
        if: always() && steps.certificate.outputs.certificate != ''
        shell: pwsh
        run: Remove-Item -Force "${{ steps.certificate.outputs.certificate }}" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mist-windows-x86_64
          path: dist/release/Mist-windows-x86_64-setup.exe
          if-no-files-found: error

  linux:
    name: Linux release packages
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: preflight
    # ort-sys's locked prebuilt ONNX Runtime uses newer glibc/libstdc++ symbols.
    # Keep the build image aligned with the documented Linux runtime baseline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/linux-packages
        with:
          packager-version: ${{ env.CARGO_PACKAGER_VERSION }}

  assemble:
    if: github.event_name == 'push' || inputs.platform == 'all'
    needs: [macos, windows, linux]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mist-*
          path: release-assets
          merge-multiple: true
      - name: Add verified installers and package-manager recipes
        shell: pwsh
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_SIGNER_SHA256: ${{ vars.WINDOWS_SIGNER_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPLE_TEAM_ID -cnotmatch '^[A-Z0-9]{10}$') { throw 'APPLE_TEAM_ID must be a 10-character Team ID.' }
          if ($env:WINDOWS_SIGNER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'WINDOWS_SIGNER_SHA256 must be a certificate SHA-256.' }
          $encoding = [Text.UTF8Encoding]::new($false)
          $assets = (Resolve-Path release-assets).Path
          $shell = [IO.File]::ReadAllText((Resolve-Path scripts/install-release.sh))
          [IO.File]::WriteAllText((Join-Path $assets 'mist-installer.sh'), $shell.Replace("`r`n", "`n").Replace('__MIST_APPLE_TEAM_ID__', $env:APPLE_TEAM_ID), $encoding)
          $powershell = [IO.File]::ReadAllText((Resolve-Path scripts/install-release.ps1))
          [IO.File]::WriteAllText((Join-Path $assets 'mist-installer.ps1'), $powershell.Replace('__MIST_WINDOWS_SIGNER_SHA256__', $env:WINDOWS_SIGNER_SHA256.ToUpperInvariant()), $encoding)
          Copy-Item assets/mist-orb-512-v1.png (Join-Path $assets 'Mist.png')
          function Write-Checksums {
            $lines = Get-ChildItem $assets -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
            }
            [IO.File]::WriteAllText((Join-Path $assets 'SHA256SUMS'), ($lines -join "`n") + "`n", $encoding)
          }
          Write-Checksums
          $version = (Get-Content VERSION -Raw).Trim()
          # Stable recipes only; prerelease installers retain their existing flow.
          if ($version -match '^\d+\.\d+\.\d+$') {
            $packages = Join-Path $env:RUNNER_TEMP 'mist-package-managers'
            node scripts/build-package-managers.mjs $version $assets $packages $env:WINDOWS_SIGNER_SHA256
            if ($LASTEXITCODE -ne 0) { throw 'Package recipe generation failed.' }
            choco pack (Join-Path $packages 'chocolatey/mist-tts.nuspec') --outputdirectory $assets
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed.' }
            Copy-Item (Join-Path $packages 'Casks/mist.rb') (Join-Path $assets 'mist.rb')
            Write-Checksums
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mist-release-bundle-${{ github.sha }}
          path: release-assets
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-22.04
    environment: release-publishing
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mist-release-bundle-${{ github.sha }}
          path: release-assets
      - name: Attest public release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$release_state" = false ]; then
            echo "Refusing to replace assets on published release $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [ -z "$release_state" ]; then
            release_flags=()
            case "$GITHUB_REF_NAME" in
              *-*) release_flags+=(--prerelease --latest=false) ;;
            esac
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Mist $GITHUB_REF_NAME" \
              --notes "Draft desktop release. Complete the macOS, Windows, X11, and Wayland acceptance checklist before publishing." \
              "${release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
