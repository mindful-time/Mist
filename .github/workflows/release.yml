name: Release complete desktop

on:
  push:
    tags:
      - "v*"
      - "!v*-rc.*-linux"
      - "!v*-rc.*-macos-aarch64"
      - "!v*-rc.*-macos-x86_64"
      - "!v*-rc.*-windows-x86_64"
      - "!v*-linux-preview.*"
      - "!v*-macos-aarch64-preview.*"
      - "!v*-macos-x86_64-preview.*"
      - "!v*-windows-x86_64-preview.*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (all builds the complete candidate bundle)
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Verify release version
        id: release
        shell: bash
        run: |
          ./scripts/release-check.sh
          version=$(tr -d '[:space:]' < VERSION)
          channel=candidate
          git fetch --no-tags origin main
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            channel=$(node scripts/release-channel.mjs "$version" "$GITHUB_REF_NAME")
            if [ "$channel" != desktop ]; then
              echo "Use the independent platform workflow for preview tags." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release tag must point to a commit on main." >&2
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Manual release tests must run from main." >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Verify successful main CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs

  macos_apple_silicon:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: macos-aarch64
      publish-preview: false
    secrets: inherit
    # Reusable-workflow permission ceiling; build/preflight jobs remain read-only.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

  macos_intel:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: macos-x86_64
      publish-preview: false
    secrets: inherit
    # Reusable-workflow permission ceiling; build/preflight jobs remain read-only.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: windows-x86_64
      publish-preview: false
    secrets: inherit
    # Reusable-workflow permission ceiling; build/preflight jobs remain read-only.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

  linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: preflight
    uses: ./.github/workflows/release-platform.yml
    with:
      platform: linux
      publish-preview: false
    secrets: inherit
    # Reusable-workflow permission ceiling; build/preflight jobs remain read-only.
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write

  assemble:
    if: github.event_name == 'push' || inputs.platform == 'all'
    needs: [preflight, macos_apple_silicon, macos_intel, windows, linux]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mist-*
          path: release-assets
          merge-multiple: true
      - name: Add verified installers and package-manager recipes
        shell: pwsh
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_SIGNER_SHA256: ${{ vars.WINDOWS_SIGNER_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:APPLE_TEAM_ID -cnotmatch '^[A-Z0-9]{10}$') { throw 'APPLE_TEAM_ID must be a 10-character Team ID.' }
          if ($env:WINDOWS_SIGNER_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'WINDOWS_SIGNER_SHA256 must be a certificate SHA-256.' }
          $encoding = [Text.UTF8Encoding]::new($false)
          $assets = (Resolve-Path release-assets).Path
          $shell = [IO.File]::ReadAllText((Resolve-Path scripts/install-release.sh))
          [IO.File]::WriteAllText((Join-Path $assets 'mist-installer.sh'), $shell.Replace("`r`n", "`n").Replace('__MIST_APPLE_TEAM_ID__', $env:APPLE_TEAM_ID), $encoding)
          $powershell = [IO.File]::ReadAllText((Resolve-Path scripts/install-release.ps1))
          [IO.File]::WriteAllText((Join-Path $assets 'mist-installer.ps1'), $powershell.Replace('__MIST_WINDOWS_SIGNER_SHA256__', $env:WINDOWS_SIGNER_SHA256.ToUpperInvariant()), $encoding)
          Copy-Item assets/mist-orb-512-v1.png (Join-Path $assets 'Mist.png')
          function Write-Checksums {
            $lines = Get-ChildItem $assets -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
            }
            [IO.File]::WriteAllText((Join-Path $assets 'SHA256SUMS'), ($lines -join "`n") + "`n", $encoding)
          }
          Write-Checksums
          $version = (Get-Content VERSION -Raw).Trim()
          # Stable and RC recipes point to the same immutable complete release.
          if ($version -match '^\d+\.\d+\.\d+(-rc\.[1-9]\d*)?$') {
            $packages = Join-Path $env:RUNNER_TEMP 'mist-package-managers'
            node scripts/build-package-managers.mjs $version $assets $packages $env:WINDOWS_SIGNER_SHA256
            if ($LASTEXITCODE -ne 0) { throw 'Package recipe generation failed.' }
            choco pack (Join-Path $packages 'chocolatey/mist-tts.nuspec') --outputdirectory $assets
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed.' }
            Copy-Item (Join-Path $packages 'Casks/mist.rb') (Join-Path $assets 'mist.rb')
            Write-Checksums
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mist-release-bundle-${{ github.sha }}
          path: release-assets
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-22.04
    environment: release-publishing
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mist-release-bundle-${{ github.sha }}
          path: release-assets
      - name: Attest public release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$release_state" = false ]; then
            echo "Refusing to replace assets on published release $GITHUB_REF_NAME." >&2
            exit 1
          fi
          if [ -z "$release_state" ]; then
            release_flags=()
            case "$GITHUB_REF_NAME" in
              *-*) release_flags+=(--prerelease --latest=false) ;;
            esac
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Mist $GITHUB_REF_NAME" \
              --notes "Draft desktop release. Complete the macOS, Windows, X11, and Wayland acceptance checklist before publishing." \
              "${release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
